<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes · Sistema de Chamados</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main>
    <h1>Clientes</h1>
    <div id="mensagem" hidden></div>

    <section class="card">
        <h2 id="titulo-form">Novo cliente</h2>
        <form id="form">
            <div class="campos">
                <label>Nome <input name="nome" maxlength="100" required></label>
                <label>E-mail <input name="email" type="email" maxlength="120" required></label>
                <label>Telefone <input name="telefone" maxlength="20"></label>
            </div>
            <div class="acoes">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelar" class="secundario" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Clientes cadastrados</h2>
        <div class="tabela">
            <table>
                <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th></th></tr></thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
    montarLayout('clientes.html');
    iniciarCrud({
        endpoint: '/clientes',
        tituloNovo: 'Novo cliente',
        tituloEditar: 'Editar cliente',
        colunas: [
            { render: c => `<a href="cliente.html?id=${c.id}">${esc(c.nome)}</a>` },
            { campo: 'email' },
            { campo: 'telefone' }
        ]
    });
</script>
</body>
</html>
