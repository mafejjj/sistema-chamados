<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias · Sistema de Chamados</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main>
    <h1>Categorias</h1>
    <div id="mensagem" hidden></div>

    <section class="card">
        <h2 id="titulo-form">Nova categoria</h2>
        <form id="form">
            <div class="campos">
                <label>Nome <input name="nome" maxlength="100" required></label>
                <label class="inteiro">Descrição <textarea name="descricao" maxlength="500"></textarea></label>
            </div>
            <div class="acoes">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelar" class="secundario" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Categorias cadastradas</h2>
        <div class="tabela">
            <table>
                <thead><tr><th>Nome</th><th>Descrição</th><th></th></tr></thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
    montarLayout('categorias.html');
    iniciarCrud({
        endpoint: '/categorias',
        tituloNovo: 'Nova categoria',
        tituloEditar: 'Editar categoria',
        colunas: [{ campo: 'nome' }, { campo: 'descricao' }]
    });
</script>
</body>
</html>
