<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Técnicos · Sistema de Chamados</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main>
    <h1>Técnicos</h1>
    <div id="mensagem" hidden></div>

    <section class="card">
        <h2 id="titulo-form">Novo técnico</h2>
        <form id="form">
            <div class="campos">
                <label>Nome <input name="nome" maxlength="100" required></label>
                <label>E-mail <input name="email" type="email" maxlength="120" required></label>
                <label>Perfil
                    <select name="perfil" required>
                        <option value="TECNICO">Técnico</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </label>
            </div>
            <div class="acoes">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelar" class="secundario" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Técnicos cadastrados</h2>
        <div class="tabela">
            <table>
                <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr></thead>
                <tbody id="linhas"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
    montarLayout('tecnicos.html');
    iniciarCrud({
        endpoint: '/tecnicos',
        tituloNovo: 'Novo técnico',
        tituloEditar: 'Editar técnico',
        colunas: [
            { campo: 'nome' },
            { campo: 'email' },
            { render: t => esc(PERFIS[t.perfil] ?? t.perfil) }
        ]
    });
</script>
</body>
</html>
